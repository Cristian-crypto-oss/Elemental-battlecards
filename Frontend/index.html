<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemental Battlecards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Contenedor de Phaser - capa de fondo */
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay Vue - capa frontal */
        .vue-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .vue-overlay > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Raíz de Vue 3 -->
    <div id="app"></div>

    <!-- Script de módulo Vue -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
